<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fff7e6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Duty" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;700&display=swap" media="print" onload="this.media='all'" />
    <title>Duty</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Register service worker with deferred update.
      // We check for a new SW on load and on tab focus (instead of every 60s),
      // and never auto-reload mid-task — the user might be filling a form.
      // The new SW activates silently and takes effect on the next manual
      // reload or navigation.
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js').then(function(reg) {
          var lastCheck = Date.now()
          function checkUpdate() {
            if (Date.now() - lastCheck < 5 * 60 * 1000) return
            lastCheck = Date.now()
            reg.update().catch(function() {})
          }
          document.addEventListener('visibilitychange', function() {
            if (document.visibilityState === 'visible') checkUpdate()
          })

          reg.addEventListener('updatefound', function() {
            var newSW = reg.installing
            if (!newSW) return
            newSW.addEventListener('statechange', function() {
              if (newSW.state === 'installed' && navigator.serviceWorker.controller) {
                newSW.postMessage('skipWaiting')
              }
            })
          })
        }).catch(function() {})
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
